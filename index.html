<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schoolhouse LMS</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#1c2538;--mut:#667189;--line:#dbe0ea;--nav:#17325f;--acc:#2b6be0;--ok:#1b8a57;--bad:#c23a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--card:#1a2130;--ink:#e6eaf3;--mut:#94a0b8;--line:#2c364b;--acc:#5b92f5;--ok:#3cc28a;--bad:#ef6b6b}}
:root[data-theme="dark"]{--bg:#10151f;--card:#1a2130;--ink:#e6eaf3;--mut:#94a0b8;--line:#2c364b;--acc:#5b92f5;--ok:#3cc28a;--bad:#ef6b6b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Source Sans 3",system-ui,sans-serif}
header{background:var(--nav);color:#fff;display:flex;align-items:center;gap:6px;padding:8px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
header b{font-size:20px;margin-right:12px}header .sp{flex:1}
header button{background:none;border:0;color:#dbe5fa;padding:8px 12px;border-radius:6px;font:inherit;cursor:pointer}
header button.on,header button:hover{background:rgba(255,255,255,.16);color:#fff}
.role{display:flex;background:rgba(255,255,255,.14);border-radius:8px;padding:3px}.role button{padding:4px 10px}.role button.on{background:#fff;color:#17325f}
main{max-width:980px;margin:20px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
h2{margin:0 0 12px;font-size:22px}h3{margin:0 0 8px;font-size:17px}.mut{color:var(--mut);font-size:14px}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.course{cursor:pointer;padding:0;overflow:hidden}.course .bar{height:70px}.course div+div{padding:12px 14px}
.banner{color:#fff;padding:22px;border-radius:8px 8px 0 0}.banner h2{margin:0}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:0;padding:11px 16px;font:inherit;color:var(--mut);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink);font-weight:600;border-color:var(--acc)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;max-width:100%}
textarea{width:100%;min-height:64px}input[type=color]{padding:2px;width:44px;height:34px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.x{background:none;color:var(--bad);border:1px solid var(--line)}.link{background:none;border:0;color:var(--acc);cursor:pointer;font:inherit;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}
.pill{font-size:13px;padding:2px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.menu{position:relative;display:inline-block}
.menu .dd{position:absolute;top:100%;left:0;background:var(--card);border:1px solid var(--line);border-radius:8px;min-width:190px;z-index:4;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:4px}
.menu .dd button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;font:inherit;color:var(--ink);cursor:pointer;border-radius:6px}.menu .dd button:hover{background:var(--bg)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}td input[type=number]{width:64px}
details{border-top:1px solid var(--line);padding:8px 0}summary{cursor:pointer;font-weight:600}
.ov{position:fixed;inset:0;background:rgba(10,16,30,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.dlg{background:var(--card);border-radius:14px;width:min(440px,100%);max-height:80vh;display:flex;flex-direction:column;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.35);gap:8px}
.pls{overflow-y:auto;flex:1;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:4px;margin:4px 0}
.pr{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-radius:8px;padding:8px 10px;font:inherit;color:var(--ink);cursor:pointer}
.pr:hover{background:var(--bg)}.pr.on{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.av{width:36px;height:36px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex:none}.pr.on .ck{background:var(--acc);border-color:var(--acc)}
.item{flex-wrap:wrap}
.sp2{position:fixed;inset:0;z-index:50;background:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;animation:sfade 3.2s forwards}
.sp2 .sl{width:200px;border-radius:22px;background:#fff;padding:8px;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
.sp2 h1{color:#fff;font-size:34px;margin:0;display:flex;flex-wrap:wrap;justify-content:center;padding:0 16px}.sp2 h1 span{display:inline-block;opacity:0;animation:rise .5s forwards}
@keyframes pop{0%{transform:scale(.3) translateY(60px) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sfade{0%,80%{opacity:1}100%{opacity:0;visibility:hidden}}
@media(prefers-reduced-motion:reduce){.sp2 .sl,.sp2 h1 span{animation:none;opacity:1}}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
</style></head><body>
<header><b id="sn"></b><span id="nav" style="display:contents"></span><span class="sp"></span>
<span id="me" style="color:#c9d4ec;font-size:14px"></span><button id="so" onclick="signOut()">Sign out</button></header>
<main id="main"></main><div id="modal"></div>
<script>
const K='schoolhouse_v2',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TODAY='2026-10-02',IC={assignment:'📝',test:'🧪',link:'🔗',page:'📄',folder:'📁'};
function seed(){const nm=['Alex Rivera','Bea Okafor','Cam Nguyen','Dara Patel','Eli Brooks','Fay Morales'],ids=nm.map((n,i)=>'s'+(i+1));
const users=[{id:'a1',name:'Principal Hayes',role:'admin'},{id:'t1',name:'Ms. Carter',role:'teacher'},...nm.map((n,i)=>({id:ids[i],name:n,role:'student'}))];
const mk=(n,sec,col,items)=>({id:uid(),name:n,sec,col,teacher:'t1',enrolled:ids.slice(),updates:[{id:uid(),text:'Welcome to the course!',time:TODAY}],items});
const c1=mk('Algebra I','Period 2','#2b6be0',[{id:uid(),type:'assignment',title:'Chapter 3 homework',due:'2026-10-09',pts:10,text:'Do problems 1-20.'},{id:uid(),type:'link',title:'Khan Academy: slope',url:'https://khanacademy.org'},{id:uid(),type:'test',title:'Linear equations quiz',due:'2026-10-12',questions:[{t:'mc',q:'Slope of y = 3x + 2?',opts:['2','3','5'],a:'3'},{t:'tf',q:'A line can have two y-intercepts.',opts:['True','False'],a:'False'},{t:'sa',q:'Solve 2x = 10. x = ?',opts:[],a:'5'}]}]);
const c2=mk('English 9','Period 4','#d4572a',[{id:uid(),type:'page',title:'Syllabus',text:'Reading, response journals, one essay per unit.'},{id:uid(),type:'assignment',title:'Reading response: Ch. 5',due:'2026-10-06',pts:15,text:'One page.'}]);
return{school:{name:'🏫 Schoolhouse',color:'#17325f'},users,courses:[c1,c2],groups:[],grades:[]};}

let S=seed(),U={user:null,view:'home',msg:'',pick:null},DB=null,tm=null,lastJ='';
function v(s){return $(s)?.value||'';}
function logo(){return S.school.logo||'';}
function me(){return S.users.find(u=>u.id===U.user)||{};}
function go(x){U.view=x;render();}
function save(){pushDb();}
function fix(){}
function home(){return `<div class="card"><h2>Dashboard</h2><p>Welcome to Schoolhouse LMS.</p></div>`;}
function enr(){return `<div class="card"><h2>Courses</h2><div class="courses">${S.courses.map(c=>`<div class="card course" onclick="U.cid='${c.id}';go('course')"><div class="bar" style="background:${c.col};padding:12px;color:#fff"><h3>${esc(c.name)}</h3><span class="mut" style="color:rgba(255,255,255,.8)">${esc(c.sec)}</span></div></div>`).join('')}</div></div>`;}
function myCourses(){return enr();}
function course(){const c=S.courses.find(x=>x.id===U.cid);return c?`<div class="card"><div class="banner" style="background:${c.col}"><h2>${esc(c.name)}</h2><p>${esc(c.sec)}</p></div><div style="margin-top:14px">${c.items.map(i=>`<div class="item"><span>${IC[i.type]||'📄'}</span> <b>${esc(i.title)}</b></div>`).join('')}</div></div>`:`<p>Course not found</p>`;}
function groups2(){return `<div class="card"><h2>Groups</h2><p>No active groups found.</p></div>`;}
function myGroups(){return groups2();}
function grades(){return `<div class="card"><h2>Grades</h2><p>No grade items tracked yet.</p></div>`;}
function admin(){return `<div class="card"><h2>Admin Panel</h2><p>Manage application settings and user profiles.</p></div>`;}
function modal(){return '';}

const used=new Set(S.users.map(u=>u.un).filter(Boolean));
S.users.forEach(u=>{if(!u.un){const t=u.name.split(' '),b=((/^(Ms|Mr|Mrs|Dr).?$/.test(t[0])?t[1]:t[0])||'user').toLowerCase().replace(/[^a-z0-9]/g,'')||'user';let n=b,i=1;while(used.has(n))n=b+(++i);used.add(n);u.un=n;u.pw=u.role==='admin'?'admin':'welcome1'}});
function pushDb(){if(!DB)return;clearTimeout(tm);tm=setTimeout(()=>{const j=JSON.stringify(S);if(j===lastJ)return;lastJ=j;DB.set({json:j}).catch(()=>{})},400)}
async function initDb(){try{const db=await claude.use('db');if(!db)return;DB=db.doc('lms/state');
DB.onSnapshot(snap=>{if(snap.exists){const j=snap.data().json;if(j===lastJ)return;lastJ=j;try{S=JSON.parse(j);fix()}catch(e){return}const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;render()}else if(!snap.metadata.fromCache){lastJ=JSON.stringify(S);DB.set({json:lastJ}).catch(()=>{})}},()=>{})}catch(e){}}
function brand(){document.documentElement.style.setProperty('--nav',S.school.color);$('#sn').innerHTML=<img src="${logo()}" alt="" style="height:30px;width:30px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-right:8px">${esc(S.school.name)}}
function login(){const ad=S.users.some(u=>u.role==='admin'&&u.pw==='admin');
return<div class="card" style="max-width:380px;margin:40px auto;text-align:center"><img src="${logo()}" alt="" style="width:150px;height:auto;border-radius:12px"><h2 style="margin:8px 0 4px">${esc(S.school.name)}</h2><p class="mut">Sign in to continue</p><input id="lu" placeholder="Username" autocomplete="username" style="width:100%" onkeydown="if(event.key==='Enter')$('#lp').focus()"><input id="lp" type="password" placeholder="Password" autocomplete="current-password" style="width:100%;margin-top:8px" onkeydown="if(event.key==='Enter')signIn()">${U.msg?${esc(U.msg)}:''}<div class="row"><button class="btn" onclick="signIn()" style="width:100%">Sign in</button></div>${ad?'<p class="mut">First time here? The admin account is username <b>admin</b>, password <b>admin</b>. Change it on the Admin page.</p>':''}</div>}
function signIn(){const un=v('#lu').toLowerCase(),pw=$('#lp').value,u=S.users.find(x=>x.un===un&&x.pw===pw);if(!u){U.msg='Wrong username or password.';render();$('#lu').value=un;return}U.msg='';U.user=u.id;U.view='home';try{sessionStorage.setItem('lms_user',u.id)}catch(e){}render();splash()}
function signOut(){U.user=null;U.msg='';U.pick=null;try{sessionStorage.removeItem('lms_user')}catch(e){}render()}
function splash(){const d=document.createElement('div');d.className='sp2';d.innerHTML=<img src="${logo()}" alt="" class="sl"><h1>${[...S.school.name].map((c,i)=>${c===' '?' ':esc(c)}).join('')}</h1>;d.onclick=()=>d.remove();document.body.appendChild(d);setTimeout(()=>d.remove(),3300)}
function setLogo(inp){const f=inp.files;if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const w=Math.min(400,im.width),h=Math.round(im.height*w/im.width),cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);S.school.logo=cv.toDataURL('image/jpeg',.8);save();render()};im.src=rd.result};rd.readAsDataURL(f)}
function addUser(){const n=v('#un'),un=v('#uu').toLowerCase(),pw=v('#up');if(!n||!un||!pw){U.msg='Enter a name, username and password.';render();return}if(S.users.some(u=>u.un===un)){U.msg='That username is taken.';render();return}S.users.push({id:uid(),name:n,un,pw,role:$('#ur').value});U.msg='';save();render()}
function setUn(id,val){val=val.trim().toLowerCase();if(!val||S.users.some(u=>u.un===val&&u.id!==id)){U.msg='Username is empty or already taken.';render();return}U.msg='';edit('users',id,'un',val)}
function del(k,id){if(k==='users'&&id===U.user){U.msg='You cannot remove the account you are signed in with.';render();return}S[k]=S[k].filter(x=>x.id!==id);if(k==='courses'&&U.cid===id)go('courses');save();render()}
function render(){if(U.user&&!S.users.some(u=>u.id===U.user))U.user=null;
if(!U.user){brand();$('#nav').innerHTML='';$('#me').textContent='';$('#so').hidden=true;$('#main').innerHTML=login();$('#modal').innerHTML='';return}
U.role=S.users.find(u=>u.id===U.user).role;$('#so').hidden=false;renderApp();$('#me').textContent=me().name+' · '+U.role}
function renderApp(){const sp=$('#pl'),st=sp?sp.scrollTop:0;document.documentElement.style.setProperty('--nav',S.school.color);brand();
const n=[['home','Home'],['courses','Courses'],['groups','Groups'],['grades','Grades']];if(U.role==='admin')n.push(['admin','Admin']);
$('#nav').innerHTML=n.map(x=><button class="${U.view===x[0]||((U.view==='course'||U.view==='mycourses')&&x[0]==='courses')||(U.view==='mygroups'&&x[0]==='groups')?'on':''}" onclick="U.gid=null;go('${x[0]}')">${x[1]}</button>).join('');
$('#main').innerHTML={home,courses:enr,mycourses:myCourses,course,groups:groups2,mygroups:myGroups,grades,admin}U.view;$('#modal').innerHTML=modal();if($('#pl'))$('#pl').scrollTop=st}
render();initDb();
