<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schoolhouse LMS</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#1c2538;--mut:#667189;--line:#dbe0ea;--nav:#17325f;--acc:#2b6be0;--ok:#1b8a57;--bad:#c23a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--card:#1a2130;--ink:#e6eaf3;--mut:#94a0b8;--line:#2c364b;--acc:#5b92f5;--ok:#3cc28a;--bad:#ef6b6b}}
:root[data-theme="dark"]{--bg:#10151f;--card:#1a2130;--ink:#e6eaf3;--mut:#94a0b8;--line:#2c364b;--acc:#5b92f5;--ok:#3cc28a;--bad:#ef6b6b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Source Sans 3",system-ui,sans-serif}
header{background:var(--nav);color:#fff;display:flex;align-items:center;gap:6px;padding:8px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
header b{font-size:20px;margin-right:12px}header .sp{flex:1}
header button{background:none;border:0;color:#dbe5fa;padding:8px 12px;border-radius:6px;font:inherit;cursor:pointer}
header button.on,header button:hover{background:rgba(255,255,255,.16);color:#fff}
.role{display:flex;background:rgba(255,255,255,.14);border-radius:8px;padding:3px}.role button{padding:4px 10px}.role button.on{background:#fff;color:#17325f}
main{max-width:980px;margin:20px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
h2{margin:0 0 12px;font-size:22px}h3{margin:0 0 8px;font-size:17px}.mut{color:var(--mut);font-size:14px}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.course{cursor:pointer;padding:0;overflow:hidden}.course .bar{height:70px}.course div+div{padding:12px 14px}
.banner{color:#fff;padding:22px;border-radius:8px 8px 0 0}.banner h2{margin:0}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:0;padding:11px 16px;font:inherit;color:var(--mut);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink);font-weight:600;border-color:var(--acc)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;max-width:100%}
textarea{width:100%;min-height:64px}input[type=color]{padding:2px;width:44px;height:34px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.x{background:none;color:var(--bad);border:1px solid var(--line)}.link{background:none;border:0;color:var(--acc);cursor:pointer;font:inherit;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}
.pill{font-size:13px;padding:2px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.menu{position:relative;display:inline-block}
.menu .dd{position:absolute;top:100%;left:0;background:var(--card);border:1px solid var(--line);border-radius:8px;min-width:190px;z-index:4;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:4px}
.menu .dd button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;font:inherit;color:var(--ink);cursor:pointer;border-radius:6px}.menu .dd button:hover{background:var(--bg)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}td input[type=number]{width:64px}
details{border-top:1px solid var(--line);padding:8px 0}summary{cursor:pointer;font-weight:600}
.ov{position:fixed;inset:0;background:rgba(10,16,30,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.dlg{background:var(--card);border-radius:14px;width:min(440px,100%);max-height:80vh;display:flex;flex-direction:column;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.35);gap:8px}
.pls{overflow-y:auto;flex:1;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:4px;margin:4px 0}
.pr{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-radius:8px;padding:8px 10px;font:inherit;color:var(--ink);cursor:pointer}
.pr:hover{background:var(--bg)}.pr.on{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.av{width:36px;height:36px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex:none}.pr.on .ck{background:var(--acc);border-color:var(--acc)}
.item{flex-wrap:wrap}
.sp2{position:fixed;inset:0;z-index:50;background:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;animation:sfade 3.2s forwards}
.sp2 .sl{width:200px;border-radius:22px;background:#fff;padding:8px;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
.sp2 h1{color:#fff;font-size:34px;margin:0;display:flex;flex-wrap:wrap;justify-content:center;padding:0 16px}.sp2 h1 span{display:inline-block;opacity:0;animation:rise .5s forwards}
@keyframes pop{0%{transform:scale(.3) translateY(60px) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sfade{0%,80%{opacity:1}100%{opacity:0;visibility:hidden}}
@media(prefers-reduced-motion:reduce){.sp2 .sl,.sp2 h1 span{animation:none;opacity:1}}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
</style></head><body>
<header><b id="sn"></b><span id="nav" style="display:contents"></span><span class="sp"></span>
<span id="me" style="color:#c9d4ec;font-size:14px"></span><button id="so" onclick="signOut()">Sign out</button></header>
<main id="main"></main><div id="modal"></div>
<script>
const K='schoolhouse_v2',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TODAY='2026-10-02',IC={assignment,test,link,page,folder:};
function seed(){const nm=['Alex Rivera','Bea Okafor','Cam Nguyen','Dara Patel','Eli Brooks','Fay Morales'],ids=nm.map((n,i)=>'s'+(i+1));
const users=[{id:'a1',name:'Principal Hayes',role:'admin'},{id:'t1',name:'Ms. Carter',role:'teacher'},...nm.map((n,i)=>({id:ids[i],name:n,role:'student'}))];
const mk=(n,sec,col,items)=>({id:uid(),name:n,sec,col,teacher:'t1',enrolled:ids.slice(),updates:[{id:uid(),text:'Welcome to the course!',time:TODAY}],items});
const c1=mk('Algebra I','Period 2','#2b6be0',[{id:uid(),type:'assignment',title:'Chapter 3 homework',due:'2026-10-09',pts:10,text:'Do problems 1-20.'},{id:uid(),type:'link',title:'Khan Academy: slope',url:'https://www.khanacademy.org'},{id:uid(),type:'test',title:'Linear equations quiz',due:'2026-10-12',questions:[{t:'mc',q:'Slope of y = 3x + 2?',opts:['2','3','5'],a:'3'},{t:'tf',q:'A line can have two y-intercepts.',opts:['True','False'],a:'False'},{t:'sa',q:'Solve 2x = 10. x = ?',opts:[],a:'5'}]}]);
const c2=mk('English 9','Period 4','#d4572a',[{id:uid(),type:'page',title:'Syllabus',text:'Reading, response journals, one essay per unit.'},{id:uid(),type:'assignment',title:'Reading response: Ch. 5',due:'2026-10-06',pts:15,text:'One page.'}]);
return{school:{name:'Tundra Secondary School',color:'#17325f'},users,courses:[c1,c2],groups:[{id:uid(),name:'Robotics Club',members:['s1','s2','s3'],posts:[{id:uid(),by:'t1',text:'First meeting is Thursday!',time:TODAY}]}],sub:{}}}
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S)S=seed();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}pushDb()};
fix();
let U={role:'admin',view:'home',cid:null,tab:'materials',item:null,menu:false,form:null,gid:null,folder:null,banner:false};
const me=()=>S.users.find(u=>u.id===U.user)||{id:'x',name:U.role,role:U.role},C=id=>S.courses.find(c=>c.id===id),nm=id=>(S.users.find(u=>u.id===id)||{name:'Unknown'}).name;
const staff=()=>U.role!=='student',sg=(c,i,s)=>S.sub[c+':'+i+':'+s]||{},pts=i=>i.type==='test'?i.questions.length:i.pts,graded=c=>c.items.filter(i=>(i.type==='assignment'||i.type==='test')&&(staff()||live(c,i)));const kid=(c,p)=>c.items.filter(i=>(i.parent||null)===p),live=(c,i)=>{while(i){if(i.pub===false)return false;const p=i.parent;i=c.items.find(x=>x.id===p)}return true},shown=(c,i)=>staff()||live(c,i);
const vis=()=>S.courses.filter(c=>U.role==='admin'||(U.role==='teacher'?c.teacher===me().id:c.enrolled.includes(me().id)));
const hasG=g=>g!==undefined&&g!=='';
function avg(c,s){let e=0,p=0;graded(c).forEach(i=>{const g=sg(c.id,i.id,s).grade;if(hasG(g)){e+=+g;p+=pts(i)}});return p?Math.round(e/p*100):null}
const ltr=p=>p==null?'–':p>=90?'A':p>=80?'B':p>=70?'C':p>=60?'D':'F',fmt=p=>p==null?'No grades yet':p+'% ('+ltr(p)+')';
const go=(v,c,t)=>{U.view=v;U.cid=c||null;U.tab=t||'materials';U.item=null;U.menu=false;U.form=null;U.folder=null;U.banner=false;render();scrollTo(0,0)};
const setRole=r=>{U.role=r;U.item=null;if(r!=='admin'&&U.view==='admin')U.view='home';if(r==='student'&&(U.view==='mycourses'||U.view==='mygroups'))U.view='home';render()};
function edit(k,id,f,v){S[k].find(x=>x.id===id)[f]=v;save();render()}
function del(k,id){S[k]=S[k].filter(x=>x.id!==id);if(k==='courses'&&U.cid===id)go('courses');save();render()}
function tog(k,id,f,v){const o=S[k].find(x=>x.id===id);o[f]=o[f].includes(v)?o[f].filter(x=>x!==v):[...o[f],v];save();render()}
const chk=(k,o,f,list)=>list.map(u=>`<label style="margin-right:12px;white-space:nowrap"><input type="checkbox" ${o[f].includes(u.id)?'checked':''} onchange="tog('${k}','${o.id}','${f}','${u.id}')"> ${esc(u.name)}</label>`).join('');
const studs=()=>S.users.filter(u=>u.role==='student');
function home(){const ups=vis().flatMap(c=>c.updates.map(u=>({...u,c}))).sort((a,b)=>b.time.localeCompare(a.time));
const due=vis().flatMap(c=>c.items.filter(i=>i.due&&i.due>=TODAY&&live(c,i)).map(i=>({...i,c}))).sort((a,b)=>a.due.localeCompare(b.due));
return`<h2>Recent activity</h2><div class="grid2"><div class="card">${ups.map(u=>`<div class="item"><span style="width:10px;height:36px;border-radius:4px;background:${u.c.col}"></span><div><b>${esc(u.c.name)}</b> <span class="mut">${u.time}</span><div>${esc(u.text)}</div></div></div>`).join('')||'<p class="mut">No updates yet. Open a course and post one.</p>'}</div>
<div class="card"><h3>Upcoming</h3>${due.map(a=>`<div class="item"><div>${IC[a.type]} <b>${esc(a.title)}</b><div class="mut">${esc(a.c.name)} · due ${a.due}</div></div></div>`).join('')||'<p class="mut">Nothing due.</p>'}</div></div>`}
const courses=()=>`<h2>Courses</h2><div class="courses">${vis().map(c=>`<div class="card course" onclick="go('course','${c.id}')"><div class="bar" style="background:${c.col}"></div><div><b>${esc(c.name)}</b><div class="mut">${esc(c.sec)} · ${nm(c.teacher)}</div></div></div>`).join('')||'<p class="mut">No courses yet. An admin can add one.</p>'}</div>`;
function course(){const c=C(U.cid);if(!c)return courses();
return`<div class="banner" style="background:${bg(c)};min-height:120px"><div class="row" style="margin:0;justify-content:space-between"><h2>${esc(c.name)}</h2>${staff()?`<button class="btn" style="background:rgba(255,255,255,.25)" onclick="U.banner=!U.banner;render()">${U.banner?'Done':'Edit banner'}</button>`:''}</div><div>${esc(c.sec)} · ${esc(nm(c.teacher))}</div>${U.banner&&staff()?`<div class="row"><input value="${esc(c.name)}" aria-label="Course name" onchange="edit('courses','${c.id}','name',this.value)"><input value="${esc(c.sec)}" aria-label="Section" onchange="edit('courses','${c.id}','sec',this.value)"><input type="color" value="${c.col}" aria-label="Banner color" onchange="edit('courses','${c.id}','col',this.value)"><input type="file" accept="image/*" aria-label="Banner image" onchange="setImg('${c.id}',this)">${c.img?`<button class="btn x" onclick="C('${c.id}').img='';save();render()">Remove image</button>`:''}</div>`:''}</div><div class="tabs">${[['materials','Materials'],['updates','Updates'],['grades','Grades'],['members','Members']].map(t=>`<button class="${U.tab===t[0]?'on':''}" onclick="U.tab='${t[0]}';U.item=null;U.folder=null;render()">${t[1]}</button>`).join('')}</div>${tabv(c)}`}
function tabv(c){const t=U.tab;
if(t==='materials')return U.item?itemView(c):mats(c);
if(t==='updates')return(staff()?`<div class="card"><textarea id="ut" placeholder="Post an update to this course"></textarea><div class="row"><button class="btn" onclick="postU('${c.id}')">Post update</button></div></div>`:'')+`<div class="card">${c.updates.slice().reverse().map(u=>`<div class="item"><div><span class="mut">${u.time}</span><div>${esc(u.text)}</div></div></div>`).join('')||'<p class="mut">No updates yet.</p>'}</div>`;
if(t==='members')return`<div class="card"><h3>${esc(nm(c.teacher))} <span class="pill">Teacher</span></h3>${staff()?`<div class="row" style="justify-content:space-between;margin:0 0 8px"><span class="mut">${c.enrolled.length} students</span><button class="btn" onclick="pick('courses','${c.id}','enrolled','students','Add students')">Add members</button></div>${c.enrolled.map(id=>`<div class="item">${esc(nm(id))}</div>`).join('')||'<p class="mut">No students enrolled yet.</p>'}`:c.enrolled.map(id=>`<div class="item">${esc(nm(id))}</div>`).join('')||'<p class="mut">No students enrolled yet.</p>'}</div>`;
if(!staff())return`<div class="card"><h3>Your grade: ${fmt(avg(c,me().id))}</h3>${graded(c).map(i=>{const g=sg(c.id,i.id,me().id).grade;return`<div class="item"><span>${IC[i.type]}</span><b style="flex:1">${esc(i.title)}</b>${hasG(g)?g+'/'+pts(i):'–'}</div>`}).join('')}</div>`;
return wts(c)+`<div class="card tw"><table><tr><th>Student</th>${graded(c).map(i=>`<th>${esc(i.title)}<div class="mut">/${pts(i)}</div></th>`).join('')}<th>Average</th></tr>${c.enrolled.map(s=>`<tr><td><b>${esc(nm(s))}</b></td>${graded(c).map(i=>`<td><input type="number" min="0" max="${pts(i)}" value="${esc(sg(c.id,i.id,s).grade??'')}" aria-label="${esc(nm(s))} ${esc(i.title)}" onchange="setG('${c.id}','${i.id}','${s}',this.value)"></td>`).join('')}<td><b>${avg(c,s)==null?'–':avg(c,s)+'% '+ltr(avg(c,s))}</b></td></tr>`).join('')}</table></div>`}
function mats(c){const F=U.form,fld={assignment:`<input id="f2" type="date" value="${TODAY}"><input id="f3" type="number" min="1" value="10" style="width:80px" aria-label="Points"><textarea id="f4" placeholder="Instructions"></textarea>`,test:`<input id="f2" type="date" value="${TODAY}"><span class="mut">Add questions after you create it.</span>`,link:`<input id="f1" placeholder="https://example.com" style="min-width:240px">`,page:`<textarea id="f4" placeholder="Page content"></textarea>`};
return(staff()?`<div class="card"><div class="menu"><button class="btn" onclick="U.menu=!U.menu;render()">Add Materials ▾</button>${U.menu?`<div class="dd">${[['assignment','Assignment'],['test','Test/Quiz'],['link','Link / Resource'],['page','Page']].map(m=>`<button onclick="U.form='${m[0]}';U.menu=false;render()">${IC[m[0]]} ${m[1]}</button>`).join('')}</div>`:''}</div>
${F?`<div class="row"><b>New ${F}</b><input id="f0" placeholder="Title">${fld[F]}<button class="btn" onclick="addItem('${c.id}')">Create</button><button class="link" onclick="U.form=null;render()">Cancel</button></div>`:''}</div>`:'')+
`<div class="card">${c.items.map(i=>`<div class="item"><span style="font-size:22px">${IC[i.type]}</span><div style="flex:1"><button class="link" onclick="U.item='${i.id}';render()"><b>${esc(i.title)}</b></button><div class="mut">${i.due?'Due '+i.due:i.type}${i.type==='test'?' · '+i.questions.length+' questions':''}</div></div>${staff()?`<button class="btn x" onclick="delItem('${c.id}','${i.id}')">Delete</button>`:''}</div>`).join('')||'<p class="mut">No materials yet. Use Add Materials to create an assignment, test, link or page.</p>'}</div>`}
function itemView(c){const i=c.items.find(x=>x.id===U.item);if(!i){U.item=null;return mats(c)}const s=me().id,sb=sg(c.id,i.id,s);
let h=`<div class="card"><button class="link" onclick="U.item=null;render()">‹ Back to materials</button><h2 style="margin-top:8px">${IC[i.type]} ${esc(i.title)}</h2>`;
if(i.type==='link')h+=`<p><a href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">${esc(i.url)}</a></p>`;
if(i.type==='page')h+=`<p style="white-space:pre-wrap">${esc(i.text)}</p>`;
if(i.type==='assignment'){h+=`<p class="mut">${pts(i)} points · due ${i.due}</p><p style="white-space:pre-wrap">${esc(i.text)}</p>`;
if(staff())h+=c.enrolled.map(id=>`<div class="item"><b style="width:140px">${esc(nm(id))}</b><span class="${sg(c.id,i.id,id).text?'ok':'mut'}">${sg(c.id,i.id,id).text?esc(sg(c.id,i.id,id).text):'Not submitted'}</span></div>`).join('');
else h+=sb.text?`<p class="ok">Submitted: ${esc(sb.text)}</p><p>${hasG(sb.grade)?'Grade: <b>'+sb.grade+'/'+i.pts+'</b>':'<span class="mut">Waiting for a grade</span>'}</p>`:`<textarea id="sb" placeholder="Type your answer"></textarea><div class="row"><button class="btn" onclick="turnIn('${c.id}','${i.id}')">Turn in</button></div>`}
if(i.type==='test'){if(staff()){h+=`<h3>Questions</h3>${i.questions.map((q,n)=>`<div class="item"><div style="flex:1"><b>${n+1}. ${esc(q.q)}</b><div class="mut">${q.t==='sa'?'Short answer':q.opts.join(' / ')} · answer: ${esc(q.a)}</div></div><button class="btn x" onclick="delQ('${c.id}','${i.id}',${n})">Remove</button></div>`).join('')||'<p class="mut">No questions yet.</p>'}
<div class="row"><select id="qt"><option value="mc">Multiple choice</option><option value="tf">True / False</option><option value="sa">Short answer</option></select><input id="qq" placeholder="Question" style="flex:1;min-width:200px"></div>
<div class="row"><input id="qo" placeholder="Options, comma separated (multiple choice)" style="flex:1;min-width:200px"><input id="qa" placeholder="Correct answer"><button class="btn" onclick="addQ('${c.id}','${i.id}')">Add question</button></div>
<h3 style="margin-top:16px">Results</h3>${c.enrolled.map(id=>{const g=sg(c.id,i.id,id).grade;return`<div class="item"><b style="flex:1">${esc(nm(id))}</b>${hasG(g)?g+'/'+pts(i):'<span class="mut">Not taken</span>'}</div>`}).join('')}`}
else if(hasG(sb.grade))h+=`<p>Score: <b>${sb.grade}/${pts(i)}</b></p>`+i.questions.map((q,n)=>{const a=(sb.ans||[])[n]||'',ok=a.trim().toLowerCase()===q.a.trim().toLowerCase();return`<div class="item"><span class="${ok?'ok':'bad'}">${ok?'✓':'✗'}</span><div><b>${esc(q.q)}</b><div class="mut">You answered: ${esc(a)||'(blank)'}${ok?'':' · Correct: '+esc(q.a)}</div></div></div>`}).join('');
else h+=i.questions.length?i.questions.map((q,n)=>`<div class="item" style="display:block"><b>${n+1}. ${esc(q.q)}</b>${q.t==='sa'?`<div><input name="q${n}" style="margin-top:6px"></div>`:q.opts.map(o=>`<label style="display:block;margin-top:4px"><input type="radio" name="q${n}" value="${esc(o)}"> ${esc(o)}</label>`).join('')}</div>`).join('')+`<div class="row"><button class="btn" onclick="takeTest('${c.id}','${i.id}')">Submit test</button></div>`:'<p class="mut">This test has no questions yet.</p>'}
return h+'</div>'}
function groups(){const g=U.gid&&S.groups.find(x=>x.id===U.gid);

const gcards=l=>l.map(x=>`<div class="card course" onclick="U.gid='${x.id}';render()"><div class="bar" style="background:#6a4fd1"></div><div><b>${esc(x.name)}</b><div class="mut">${x.members.length} members</div></div></div>`).join('');
function enr(){const l=S.courses.filter(c=>c.enrolled.includes(me().id)||vis().includes(c));return`<div class="row" style="justify-content:space-between;margin:0 0 8px"><h2 style="margin:0">Courses</h2>${staff()?`<button class="btn" onclick="go('mycourses')">My Courses</button>`:''}</div><p class="mut">All your courses: the ones you are enrolled in and the ones you teach.</p><div class="courses">${cards(l,'courses')||'<p class="mut">You are not enrolled in any courses yet.</p>'}</div>`}
function myCourses(){return`<button class="link" onclick="go('courses')">‹ Back to Courses</button><h2 style="margin-top:8px">My Courses</h2><p class="mut">Courses you teach.</p><div class="grid2"><div class="courses" style="align-content:start">${cards(vis(),'mycourses')||'<p class="mut">You are not teaching any courses yet. Create one on the right.</p>'}</div><div class="card"><h3>New Course</h3><input id="nc" placeholder="Course name" style="width:100%"><input id="ns" placeholder="Section" style="width:100%;margin-top:8px"><div class="row"><button class="btn" onclick="newCourse()">New Course</button></div><p class="mut">After creating it, add students on the Members tab and a banner image with Edit banner.</p></div></div>`}
function groups2(){if(U.gid)return groups();const l=S.groups.filter(g=>g.members.includes(me().id)||(staff()&&(U.role==='admin'||!g.owner||g.owner===me().id)));return`<div class="row" style="justify-content:space-between;margin:0 0 8px"><h2 style="margin:0">Groups</h2>${staff()?`<button class="btn" onclick="U.gid=null;go('mygroups')">My Groups</button>`:''}</div><p class="mut">All your groups: the ones you belong to and the ones you manage.</p><div class="courses">${gcards(l)||'<p class="mut">You are not in any groups yet.</p>'}</div>`}
function myGroups(){if(U.gid)return groups();const l=S.groups.filter(g=>U.role==='admin'||!g.owner||g.owner===me().id);return`<button class="link" onclick="U.gid=null;go('groups')">‹ Back to Groups</button><h2 style="margin-top:8px">My Groups</h2><p class="mut">Groups you manage.</p><div class="grid2"><div class="courses" style="align-content:start">${gcards(l)||'<p class="mut">You have not created any groups yet. Create one on the right.</p>'}</div><div class="card"><h3>New Group</h3><input id="gn" placeholder="Group name" style="width:100%"><div class="row"><button class="btn" onclick="addGroup()">New Group</button></div><p class="mut">After creating it, add members and group admins from the group page.</p></div></div>`}
function addGroup(){const n=v('#gn');if(!n)return;S.groups.push({id:uid(),name:n,members:[],admins:[],res:[],posts:[],owner:me().id});save();render()}
function pick(k,id,f,src,title){U.pick={k,id,f,src,title};U.q='';render()}
function pickList(){const p=U.pick,o=S[p.k].find(x=>x.id===p.id);let l=p.src==='students'?studs():p.src==='members'?S.users.filter(u=>o.members.includes(u.id)):S.users;const q=(U.q||'').toLowerCase();l=l.filter(u=>u.name.toLowerCase().includes(q));
return l.map(u=>{const on=o[p.f].includes(u.id);return`<button class="pr${on?' on':''}" role="checkbox" aria-checked="${on}" onclick="tog('${p.k}','${o.id}','${p.f}','${u.id}')"><span class="av" style="background:hsl(${[...u.id].reduce((a,c)=>a+c.charCodeAt(0),0)*37%360} 55% 42%)">${esc(u.name.split(' ').map(w=>w[0]).slice(0,2).join(''))}</span><span style="flex:1;text-align:left"><b>${esc(u.name)}</b><div class="mut">${u.role}</div></span><span class="ck">${on?'✓':''}</span></button>`}).join('')||'<p class="mut" style="padding:12px">No one found.</p>'}
function modal(){const p=U.pick;if(!p)return'';const o=S[p.k].find(x=>x.id===p.id);if(!o){U.pick=null;return''}
return`<div class="ov" onclick="if(event.target===this){U.pick=null;render()}"><div class="dlg" role="dialog" aria-modal="true" aria-label="${esc(p.title)}"><h3 style="margin:0">${esc(p.title)}</h3><div class="mut">${esc(o.name)} · ${o[p.f].length} selected</div><input id="pq" placeholder="Search people" value="${esc(U.q||'')}" oninput="U.q=this.value;$('#pl').innerHTML=pickList()" style="width:100%"><div id="pl" class="pls">${pickList()}</div><div class="row" style="justify-content:flex-end;margin:0"><button class="btn" onclick="U.pick=null;render()">Done</button></div></div></div>`}
addEventListener('keydown',e=>{if(e.key==='Escape'&&U.pick){U.pick=null;render()}});

let DB=null,lastJ='',tm=0;
function fix(){S.groups.forEach(g=>{g.admins=g.admins||[];g.res=g.res||[]});
if(S.school.name==='🏫 Schoolhouse')S.school.name='Tundra Academy';
const used=new Set(S.users.map(u=>u.un).filter(Boolean));
S.users.forEach(u=>{if(!u.un){const t=u.name.split(' '),b=((/^(Ms|Mr|Mrs|Dr)\.?$/.test(t[0])?t[1]:t[0])||'user').toLowerCase().replace(/[^a-z0-9]/g,'')||'user';let n=b,i=1;while(used.has(n))n=b+(++i);used.add(n);u.un=n;u.pw=u.role==='admin'?'admin':'welcome1'}})}
function pushDb(){if(!DB)return;clearTimeout(tm);tm=setTimeout(()=>{const j=JSON.stringify(S);if(j===lastJ)return;lastJ=j;DB.set({json:j}).catch(()=>{})},400)}
async function initDb(){try{const db=await claude.use('db');if(!db)return;DB=db.doc('lms/state');
DB.onSnapshot(snap=>{if(snap.exists){const j=snap.data().json;if(j===lastJ)return;lastJ=j;try{S=JSON.parse(j);fix()}catch(e){return}const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;render()}else if(!snap.metadata.fromCache){lastJ=JSON.stringify(S);DB.set({json:lastJ}).catch(()=>{})}},()=>{})}catch(e){}}
function brand(){document.documentElement.style.setProperty('--nav',S.school.color);$('#sn').innerHTML=`<img src="${logo()}" alt="" style="height:30px;width:30px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-right:8px">${esc(S.school.name)}`}
function login(){const ad=S.users.some(u=>u.role==='admin'&&u.pw==='admin');
return`<div class="card" style="max-width:380px;margin:40px auto;text-align:center"><img src="${logo()}" alt="" style="width:150px;height:auto;border-radius:12px"><h2 style="margin:8px 0 4px">${esc(S.school.name)}</h2><p class="mut">Sign in to continue</p><input id="lu" placeholder="Username" autocomplete="username" style="width:100%" onkeydown="if(event.key==='Enter')$('#lp').focus()"><input id="lp" type="password" placeholder="Password" autocomplete="current-password" style="width:100%;margin-top:8px" onkeydown="if(event.key==='Enter')signIn()">${U.msg?`<p class="bad">${esc(U.msg)}</p>`:''}<div class="row"><button class="btn" onclick="signIn()" style="width:100%">Sign in</button></div>${ad?'<p class="mut">First time here? The admin account is username <b>admin</b>, password <b>admin</b>. Change it on the Admin page.</p>':''}</div>`}
function signIn(){const un=v('#lu').toLowerCase(),pw=$('#lp').value,u=S.users.find(x=>x.un===un&&x.pw===pw);if(!u){U.msg='Wrong username or password.';render();$('#lu').value=un;return}U.msg='';U.user=u.id;U.view='home';try{sessionStorage.setItem('lms_user',u.id)}catch(e){}render();splash()}
function signOut(){U.user=null;U.msg='';U.pick=null;try{sessionStorage.removeItem('lms_user')}catch(e){}render()}
function splash(){const d=document.createElement('div');d.className='sp2';d.innerHTML=`<img src="${logo()}" alt="" class="sl"><h1>${[...S.school.name].map((c,i)=>`<span style="animation-delay:${.7+i*.05}s">${c===' '?'&nbsp;':esc(c)}</span>`).join('')}</h1>`;d.onclick=()=>d.remove();document.body.appendChild(d);setTimeout(()=>d.remove(),3300)}
function setLogo(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const w=Math.min(400,im.width),h=Math.round(im.height*w/im.width),cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);S.school.logo=cv.toDataURL('image/jpeg',.8);save();render()};im.src=rd.result};rd.readAsDataURL(f)}
function addUser(){const n=v('#un'),un=v('#uu').toLowerCase(),pw=v('#up');if(!n||!un||!pw){U.msg='Enter a name, username and password.';render();return}if(S.users.some(u=>u.un===un)){U.msg='That username is taken.';render();return}S.users.push({id:uid(),name:n,un,pw,role:$('#ur').value});U.msg='';save();render()}
function setUn(id,val){val=val.trim().toLowerCase();if(!val||S.users.some(u=>u.un===val&&u.id!==id)){U.msg='Username is empty or already taken.';render();return}U.msg='';edit('users',id,'un',val)}
function del(k,id){if(k==='users'&&id===U.user){U.msg='You cannot remove the account you are signed in with.';render();return}S[k]=S[k].filter(x=>x.id!==id);if(k==='courses'&&U.cid===id)go('courses');save();render()}
function render(){if(U.user&&!S.users.some(u=>u.id===U.user))U.user=null;
if(!U.user){brand();$('#nav').innerHTML='';$('#me').textContent='';$('#so').hidden=true;$('#main').innerHTML=login();$('#modal').innerHTML='';return}
U.role=S.users.find(u=>u.id===U.user).role;$('#so').hidden=false;renderApp();$('#me').textContent=me().name+' · '+U.role}
function renderApp(){const sp=$('#pl'),st=sp?sp.scrollTop:0;document.documentElement.style.setProperty('--nav',S.school.color);brand();

const n=[['home','Home'],['courses','Courses'],['groups','Groups'],['grades','Grades']];if(U.role==='admin')n.push(['admin','Admin']);
$('#nav').innerHTML=n.map(x=>`<button class="${U.view===x[0]||((U.view==='course'||U.view==='mycourses')&&x[0]==='courses')||(U.view==='mygroups'&&x[0]==='groups')?'on':''}" onclick="U.gid=null;go('${x[0]}')">${x[1]}</button>`).join('');
$('#main').innerHTML={home,courses:enr,mycourses:myCourses,course,groups:groups2,mygroups:myGroups,grades,admin}[U.view]();$('#modal').innerHTML=modal();if($('#pl'))$('#pl').scrollTop=st}
render();initDb();
